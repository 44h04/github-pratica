<body>

    <h1> Form de Cadastro</h1>
    <hr <form action="">
    <h3>Selecione o seu genero</h3>
    <input type="radio" name="genero" id="genero" value="m">
    <label for="genero">Masculino</label> <br>

    <input type="radio" name="genero" id="genero" value="f">
    <label for="genero">feminino</label> <br>

    <input type="radio" name="genero" id="genero" value="d">
    <label for="genero">ditador</label> <br>
    <!-- //type radio é uma bolinha de seleção -->

    <h3>Qauis meios de transporte usas</h3>
    <input type="checkbox" name="transporte" id="transporte" value="carro">
    <label for="transporte">Carro</label> <br>
    
    <input type="checkbox" name="transporte" id="transporte" value="moto">
    <label for="transporte">moto</label> <br>

    <input type="checkbox" name="transporte" id="transporte" value="dirigivel">
    <label for="transporte">Dirigível</label> <br>
    
    <h3> Selecione o seu tamanho de camisa</h3>
    <select name="tamanho" id="tamanho">
        <option value="p">P</option>
        <option value="m">M</option>
        <option value="g">G</option>
        <option value="gg">GG</option> <br>
    </select>

    <h3>Digite seu nome</h3>
    <label for="nome">Nome</label> <br>
    <input type="text" name="nome" id="nome"required>

    <br> <br>
    <label for="email">Email</label> <br>
    <input type="email" name="email" id="email" required> <br> <br>
    <label for="senha">Senha</label> <br>
    <input type="password" name="senha" id="senha" required> <br> <br>

    <textarea name="opiniao" placeholder="Deixe sua opinião..."></textarea>
